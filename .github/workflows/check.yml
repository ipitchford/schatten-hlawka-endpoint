name: Finite checker replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Normal finite checks and negative controls
        run: |
          python -B checks/verify.py
          python -B checks/reviewer_check.py
          python -B checks/test_guards.py
      - name: Optimized finite checks and negative controls
        run: |
          python -B -O checks/verify.py
          python -B -O checks/reviewer_check.py
          python -B -O checks/test_guards.py
